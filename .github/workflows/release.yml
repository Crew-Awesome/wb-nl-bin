name: Release

permissions:
  contents: write
  pull-requests: write

on: 
  workflow_dispatch:
    inputs: 
      version: 
        type: string
        required: false
        description: "Version number e.g., 6.10.0 or latest"
  push:
    tags:
      - 'v*'
    branches:
      - main

env:
  VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || (github.ref == 'refs/heads/main' && 'latest') || 'nightly' }}
  VERSION_WITH_V: ${{ inputs.version != '' && (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || (github.ref == 'refs/heads/main' && 'v-latest') || 'nightly' }}

jobs:
  release-info:
    runs-on: ubuntu-latest
    steps:
    - name: Release info 
      run: |
        echo "VERSION: $VERSION"
        echo "VERSION_WITH_V: $VERSION_WITH_V"
      
  build-linux:
    needs: [release-info]
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
        GIT_DISCOVERY_ACROSS_FILESYSTEM: 1

    strategy:
      matrix:
        include:
          - arch: amd64
            toolchain: ''
            neuarch: 'x64'
          - arch: arm64
            toolchain: '-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-aarch64.cmake'
            neuarch: 'arm64'
          - arch: armhf
            toolchain: '-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-armhf.cmake'
            neuarch: 'armhf'

    steps:
    - name: Checkout 
      uses: actions/checkout@v6

    - name: Setup cross-compile
      if: ${{ matrix.arch == 'arm64' || matrix.arch == 'armhf' }}
      run: |
        dpkg --add-architecture ${{ matrix.arch }}
        mv /etc/apt/sources.list /etc/apt/sources.list.amd64.bak

        tee /etc/apt/sources.list <<'EOF'
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main universe multiverse restricted
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main universe multiverse restricted
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-security main universe multiverse restricted

        deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports jammy main universe multiverse restricted
        deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe multiverse restricted
        deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe multiverse restricted
        EOF

    - name: Install amd64 dependencies
      if: ${{ matrix.arch == 'amd64' }}
      run: |
        apt-get update
        apt-get install -y -f \
          g++ \
          libgtk-3-dev \
          libwebkit2gtk-4.0-dev

    - name: Install arm64 toolchains and dependencies
      if: ${{ matrix.arch == 'arm64' }}
      run: |
        apt-get clean
        apt-get update
        apt-get install -y \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libgtk-3-dev:arm64 libwebkit2gtk-4.0-dev:arm64

    - name: Install arm64 toolchains and dependencies
      if: ${{ matrix.arch == 'armhf' }}
      run: |
        apt-get clean
        apt-get update
        apt-get install -y \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
          libgtk-3-dev:armhf libwebkit2gtk-4.0-dev:armhf


    - name: Install common dependencies
      run: |
        apt-get update
        apt-get install -y -f \
          pkg-config \
          git \
          cmake \
          ninja-build

    - name: Build ${{ matrix.arch }}
      run: |
        git config --global --add safe.directory $GITHUB_WORKSPACE
        mkdir -p build
        cmake -DCMAKE_BUILD_TYPE=Release . -G Ninja -B build ${{ matrix.toolchain }}
        ninja -C build -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: linux_${{ matrix.neuarch }}_binary
        path: |
          bin/neutralino-linux_${{ matrix.neuarch }}

  build-windows:
    needs: [release-info]
    runs-on: windows-2022
    steps:
    - name: Checkout 
      uses: actions/checkout@v6
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Build    
      shell: cmd
      run: |
        mkdir build
        cmake -DCMAKE_BUILD_TYPE=Release . -G "Ninja" -B build
        ninja -C build -j %NUMBER_OF_PROCESSORS%
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: win_binary
        path: bin/neutralino-win_x64.exe

  build-darwin:
    needs: [release-info]
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build arm64
      run: |
        mkdir -p build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 . -G Ninja -B build
        if ! ninja -C build > /tmp/build_arm64.log 2>&1; then
          cat /tmp/build_arm64.log
          PASTE_URL=$(curl -s -X POST --data-binary @/tmp/build_arm64.log https://paste.rs || true)
          echo "::error::arm64 build failed: $PASTE_URL"
          exit 1
        fi
        echo "=== ARM64 BUILD COMPLETED ==="
        ls -la bin/

    - name: Build x64
      run: |
        rm -fr build
        mkdir -p build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 . -G Ninja -B build
        if ! ninja -C build > /tmp/build_x64.log 2>&1; then
          cat /tmp/build_x64.log
          PASTE_URL=$(curl -s -X POST --data-binary @/tmp/build_x64.log https://paste.rs || true)
          echo "::error::x64 build failed: $PASTE_URL"
          exit 1
        fi
        echo "=== X64 BUILD COMPLETED ==="
        ls -la bin/

    - name: Merge universal
      run: |
        echo "=== BIN DIRECTORY ==="
        ls -la bin/
        if ! lipo bin/neutralino-mac_x64 bin/neutralino-mac_arm64 -create -output bin/neutralino-mac_universal > /tmp/lipo.log 2>&1; then
          cat /tmp/lipo.log
          LIPO_ERR=$(cat /tmp/lipo.log)
          PASTE_URL=$(curl -s -X POST --data-binary @/tmp/lipo.log https://paste.rs || true)
          echo "::error::lipo failed ($PASTE_URL): $LIPO_ERR"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: darwin_binary
        path: |
          bin/neutralino-mac_x64
          bin/neutralino-mac_arm64
          bin/neutralino-mac_universal
        
  create-release:
    needs: [build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 
      uses: actions/checkout@v6
        
    - name: Download Linux build artifacts 
      uses: actions/download-artifact@v8
      with:
        name: linux_x64_binary
        path: ./bin
        
    - name: Download Linux build artifacts 
      uses: actions/download-artifact@v8
      with:
        name: linux_arm64_binary
        path: ./bin
        
    - name: Download Linux build artifacts 
      uses: actions/download-artifact@v8
      with:
        name: linux_armhf_binary
        path: ./bin

    - name: Download Windows build artifacts
      uses: actions/download-artifact@v8
      with:
        name: win_binary
        path: ./bin
        
    - name: Download Darwin build artifacts 
      uses: actions/download-artifact@v8
      with:
        name: darwin_binary
        path: ./bin
        
    - name: Create release ZIP
      working-directory: ./bin
      run: |
        zip -9 neutralinojs-${VERSION_WITH_V}.zip \
          neutralino-linux_x64 \
          neutralino-linux_arm64 \
          neutralino-linux_armhf \
          neutralino-win_x64.exe \
          neutralino-mac_x64 \
          neutralino-mac_arm64 \
          neutralino-mac_universal

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "$VERSION_WITH_V" &> /dev/null; then
          echo "Updating existing release: $VERSION_WITH_V"
          gh release upload "$VERSION_WITH_V" "./bin/neutralinojs-${VERSION_WITH_V}.zip" --clobber
        else
          echo "Creating new release: $VERSION_WITH_V"
          gh release create "$VERSION_WITH_V" \
            "./bin/neutralinojs-${VERSION_WITH_V}.zip" \
            --title "WeekBox Neutralino Runtime $VERSION_WITH_V" \
            --generate-notes
        fi
